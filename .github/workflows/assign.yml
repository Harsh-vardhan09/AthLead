name: Assign Issue

on:
  issue_comment:
    types: [created]

jobs:
  assign:
    # Only run for comments on issues, not PRs
    if: ${{ !github.event.issue.pull_request && startsWith(github.event.comment.body, '/assign') }}
    runs-on: ubuntu-latest

    permissions:
      issues: write
      contents: read

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Assign commenter to issue
        uses: actions/github-script@v7
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
          script: |
             const { handler } = await import(`${process.env.GITHUB_WORKSPACE}/.github/scripts/issue_management/main.js`);

             await handler({ github, context, core });