name: Assign Issue

on:
  issue_comment:
    types: [created]

jobs:
  assign:
    # Only run for comments on issues, not PRs
    if: ${{ !github.event.issue.pull_request && startsWith(github.event.comment.body, '/assign') }}
    runs-on: ubuntu-latest

    permissions:
      issues: write

    steps:
      - name: Assign commenter to issue
        uses: actions/github-script@v7
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
          script: |
            const issue = context.issue;
            const username = context.payload.comment.user.login;

            await github.rest.issues.addAssignees({
              owner: issue.owner,
              repo: issue.repo,
              issue_number: issue.number,
              assignees: [username]
            });

            await github.rest.issues.createComment({
              owner: issue.owner,
              repo: issue.repo,
              issue_number: issue.number,
              body: `✅ @${username} has been assigned to this issue! Make sure to read CONTRIBUTION.md and start the repo`
            });
