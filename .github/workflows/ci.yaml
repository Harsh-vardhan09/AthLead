name: CI checks for repo

on:
  pull_request:
  push:
    branches:
      - main

jobs:
  code-format:
    runs-on: ubuntu-latest

    steps:
        - name: Checkout Code
          uses: actions/checkout@v4
        - uses: actions/setup-node@v4
          with:
            node-version: 20

        - name: Frontend checks(build,lint,format)
          run: npm ci
          working-directory: Athlead-client

        - run: npm run format
          working-directory: Athlead-client

        - run: npm run lint
          working-directory: Athlead-client

        - run: npm run build
          working-directory: Athlead-client

        # BACKEND

        - name: Backend Checks checks(build,lint,format)
          run: npm ci
          working-directory: Backend

        - run: npm run format
          working-directory: Backend

        - run: npm run lint
          working-directory: Backend

  ml-tests:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    defaults:
      run:
        working-directory: ML

    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v7
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: |
            ML/requirements.txt
            ML/requirements-test.txt
      - name: Install ML test dependencies
        run: python -m pip install -r requirements-test.txt
      - name: Run ML API tests
        run: python -m unittest discover -s tests -v
