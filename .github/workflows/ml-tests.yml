name: ML Service Tests

on:
  push:
    paths:
      - "ML/**"
      - ".github/workflows/ml-tests.yml"
  pull_request:
    paths:
      - "ML/**"
      - ".github/workflows/ml-tests.yml"

jobs:
  test:
    name: ML API Integration Tests
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"
          cache-dependency-path: ML/requirements.txt

      - name: Install ML service dependencies
        run: |
          pip install -r ML/requirements.txt
          pip install pytest httpx

      - name: Run ML integration tests
        run: pytest ML/tests/ -v
