name: PR Issue Check

on:
  # pull_request_target runs the workflow from the base branch with a write token,
  # so fork PRs can be commented on and closed. PR code is never checked out.
  pull_request_target:
    types: [opened, reopened]

jobs:
  check-linked-issue:
    runs-on: ubuntu-latest

    permissions:
      contents: read
      issues: read
      pull-requests: write

    steps:
      - name: Checkout base branch
        uses: actions/checkout@v4

      - name: Verify PR follows the template and is linked to an assigned issue
        uses: actions/github-script@v7
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
          script: |
            const { checkPullRequest } = await import(`${process.env.GITHUB_WORKSPACE}/.github/scripts/pr_management/checkPullRequest.js`);

            await checkPullRequest(github, context, core);
