name: Unassign Stale Issues

on:
  schedule:
    - cron: "0 0 * * *" # daily at 00:00 UTC
  workflow_dispatch:

jobs:
  unassign-stale:
    runs-on: ubuntu-latest

    permissions:
      contents: read
      issues: write
      pull-requests: read

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Unassign issues with no linked PR after 5 days
        uses: actions/github-script@v7
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
          script: |
            const { unassignStale } = await import(`${process.env.GITHUB_WORKSPACE}/.github/scripts/issue_management/unassignStale.js`);

            await unassignStale(github, context, core);
